[package]
name = "mydb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mydb = { path = "../..", default-features = false, features = ["fuzzing"] }

[patch.crates-io]
openssl-src = { path = "../../vendor/openssl-src" }

[[bin]]
name = "mysql_packet"
path = "fuzz_targets/mysql_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "row_codec"
path = "fuzz_targets/row_codec.rs"
test = false
doc = false
bench = false

[[bin]]
