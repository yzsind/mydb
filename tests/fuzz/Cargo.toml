test = false
doc = false
bench = false

[[bin]]
name = "wal_frame"
path = "fuzz_targets/wal_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "expression_differential"
path = "fuzz_targets/expression_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_repl_protocol"
path = "fuzz_targets/native_repl_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
