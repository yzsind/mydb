[package]
name = "mydb-cli"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
description = "Interactive and batch SQL client for MyDB"
license = "Apache-2.0"
repository = "https://github.com/yzsind/mydb"
publish = false

[workspace]

[dependencies]
mysql = { version = "28.0.4", path = "../../vendor/mysql", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
clap = { version = "4.6", features = ["derive"] }
rustyline = "18.0.1"
rpassword = "7.5"
ctrlc = "3.5"
unicode-width = "0.2"
tempfile = "3"

[dev-dependencies]

