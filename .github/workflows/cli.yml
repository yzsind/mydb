name: MyDB CLI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clients/mydb-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/mydb-cli
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Isolate temporary test files
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, tempfile
          path = pathlib.Path('/tmp/mydb') if os.name != 'nt' else pathlib.Path(tempfile.gettempdir()) / 'mydb'
          path.mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name in ['TMPDIR', 'TMP', 'TEMP']:
                  output.write(name + '=' + str(path) + '\n')
          PY
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo nextest run --locked --config-file .config/nextest.toml --no-fail-fast
      - run: cargo build --locked --release
      - run: cargo run --locked -- --help
      - run: cargo run --locked -- --version

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --manifest-path clients/mydb-cli/Cargo.toml --locked --all-features --config deny.toml check advisories licenses sources
