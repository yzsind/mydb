name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  dependency-safety:
    name: Dependency advisories, licenses and sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked --all-features check advisories licenses sources

  quality:
    name: Format, features and high-confidence lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - run: scripts/render_storage_format_versions.sh --check
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_release_build.py
      # The repository still has a sizeable style-warning backlog. Keep new
      # correctness/suspicious defects blocking while that backlog is reduced.
      - run: cargo clippy --locked --all-targets --all-features -- -A warnings -D clippy::correctness -D clippy::suspicious

  test:
    name: Test (${{ matrix.features }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - default
          - no-mysql-replica
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - if: matrix.features == 'default'
        run: cargo nextest run --locked --no-fail-fast
      - if: matrix.features == 'no-mysql-replica'
        run: cargo nextest run --locked --no-default-features --features tls,fast-alloc --no-fail-fast

  native-readiness:
    name: Native recovery and binary protocol gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-readiness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 1.2.3 drops the final OK packet on cold non-TLS RSA authentication.
      - run: python -m pip install 'pymysql==1.1.2' cryptography mysql-connector-python
      - run: python scripts/test_linux_compat.py
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mysql-client openssl
      - run: cargo build --locked --features tools --bin mydb --bin mydb-backup
      - run: python scripts/test_native_readiness.py --binary target/debug/mydb --output /tmp/mydb/native-readiness-ci
      - run: python scripts/test_backup_recovery.py --profile debug --rows 1000 --pairs 1
      - run: python scripts/test_backup_recovery.py --profile debug --rows 1000 --pairs 1 --encrypted
      - run: python scripts/test_release_security.py --binary target/debug/mydb --output /tmp/mydb/release-security-ci
      - run: python scripts/test_release_storage.py --binary target/debug/mydb --output /tmp/mydb/release-storage-ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-readiness
          path: |
            /tmp/mydb/native-readiness-ci
            /tmp/mydb/native-acceptance-*
            /tmp/mydb/backup-recovery-*
            /tmp/mydb/release-security-ci
            /tmp/mydb/release-storage-ci

  feature-matrix:
    name: Compile feature surface (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            args: --no-default-features
          - name: tools
            args: --features tools
          - name: all-features
            args: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-${{ matrix.name }}
      - run: cargo check --locked --all-targets ${{ matrix.args }}

  msrv:
    name: Minimum supported Rust 1.95
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.95
      - run: cargo check --locked --all-targets

  platform-check:
    name: macOS compile and release smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - run: cargo check --locked --all-targets --all-features
      - run: cargo run --locked --release --bin mydb -- --help

  mtr-non-regression:
    name: MySQL MTR semantic non-regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: mtr
      # GPL upstream inputs remain uncommitted; fetch the pinned oracle used by
      # scripts/mtr_import.sh and hold this high-signal cluster to its audited
      # statement-level blocker budget. The budget may only move downward.
      - run: scripts/mtr_import.sh type_float type_enum type_set type_year
      - run: test -s tests/mydb-test/triage/t/main/type_float.test && test -s tests/mydb-test/triage/t/main/type_enum.test && test -s tests/mydb-test/triage/t/main/type_set.test && test -s tests/mydb-test/triage/t/main/type_year.test
      - name: Run statement-level compatibility budget
        env:
          MYDB_MTR_TRIAGE: 1
          MYDB_MTR_TRIAGE_FILTER: main/type_
          MYDB_MTR_TRIAGE_EXPECT_FILES: 4
          MYDB_MTR_TRIAGE_MAX_BLOCKERS: 0
          MYDB_MTR_TRIAGE_REPORT_DIR: /tmp/mydb/mtr-report
        run: cargo nextest run --locked --no-capture mtr_triage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtr-triage-report
          path: /tmp/mydb/mtr-report
