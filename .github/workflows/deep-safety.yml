name: Deep safety

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      run_asan:
        description: Run the ASan fuzz job
        type: boolean
        default: true
      seconds:
        description: 'Per-target fuzz seconds (keep at or below 400 to fit the job timeout)'
        type: number
        default: 60

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  thread-sanitizer:
    name: ThreadSanitizer concurrency paths
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Validate TSan test selection runner
        run: python3 scripts/test_tsan_runner.py
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: tsan
      - name: Verify release source fingerprint
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from build_linux_glibc217 import source_hash
          actual = source_hash(Path.cwd())
          assert actual == 'd9425b7480a0b8e6042e86ca1189747a38936171dd3036e323b82ffabdfa491b', actual
          print('Release source fingerprint:', actual)
          PYTHON
      - run: scripts/run_tsan_btree.sh

  decoder-fuzz:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_asan }}
    name: ASan decoder fuzz deep run
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/fuzz -> /tmp/mydb/fuzz/build
          key: deep-safety-asan
      - uses: actions/cache@v4
        with:
          path: /tmp/mydb/fuzz/corpus
          key: deep-safety-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: deep-safety-corpus-
      - run: mkdir -p /tmp/mydb
      - run: python3 scripts/run_fuzz.py --output /tmp/mydb/fuzz --seconds ${{ inputs.seconds || 60 }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-fuzz-evidence
          path: |
            /tmp/mydb/fuzz/*.log
            /tmp/mydb/fuzz/results.json
            /tmp/mydb/fuzz/artifacts
            /tmp/mydb/fuzz/corpus
