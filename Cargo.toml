[package]
name = "mydb"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
description = "A general-purpose MySQL-protocol-compatible database written in Rust, with WAL, MVCC, B-tree indexes, and a query planner."
license = "Apache-2.0"
repository = "https://github.com/yzsind/mydb"
readme = "README.md"
keywords = ["database", "mysql", "htap", "sql", "vector"]
categories = ["database-implementations"]
default-run = "mydb"
autobins = false

[features]
default = ["tls", "fast-alloc", "zstd-compression"]
tools = []
tls = []
# Control protocol negotiation; the replica receiver also needs zstd for binlog payloads.
zstd-compression = []
fuzzing = []
# Default fast global allocator (mimalloc), reducing malloc/free CPU on the
# high-churn OLTP path. To use the platform fallback allocator while keeping
# TLS and zstd protocol compression:
#   cargo build --no-default-features --features tls,zstd-compression
fast-alloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[build-dependencies]
chrono = "0.4"

[dependencies]
half = "=2.7.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["unbounded_depth", "raw_value"] }
jsonschema = { version = "0.49.2", default-features = false }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
ipnet = { version = "2", features = ["serde"] }
zeroize = "1"
httpdate = "1"
flate2 = "1"
aes = "0.8"
aes-gcm = "0.10"
ecb = { version = "0.1", features = ["alloc"] }
sqlparser = "0.61.0"
# Bound recursive scalar evaluation before entering large debug stack frames.
stacker = "0.1.24"
tokio = { version = "1.53.3", features = ["macros", "net", "fs", "rt-multi-thread", "io-util", "signal", "sync", "time"] }
chrono = "0.4"
# tokio-rustls = "0.26.4"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = "0.14.7"
x509-parser = "0.16"
libc = "0.2"
regex = "1"
rand = "0.8"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
openssl = { version = "0.10.81", features = ["vendored"] }
crc32fast = "1"
# Pure-Rust LZ4 with no C bindings and no unsafe. safe-encode/safe-decode
# disable its unsafe paths, honoring this repository's no-unsafe constraint.
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
lru = "0.18.2"
parking_lot = { version = "0.12", features = ["arc_lock", "send_guard"] }
arc-swap = "1"
# Fast allocator, enabled by default via `fast-alloc`. Optional dependencies
# allow builds without the non-Rust allocator using --no-default-features.
mimalloc = { version = "0.1", optional = true }
libmimalloc-sys = { version = "0.1", optional = true, features = ["extended"] }
ahash = "0.8"
smallvec = { version = "1", features = ["serde"] }
memchr = "2"
simdutf8 = "0.1"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
hashbrown = "0.14"
crossbeam-deque = "0.8"
itoa = "1"
ryu = "1"
encoding_rs = "0.8"
unicode-normalization = "0.1"
mysql = { version = "28.0.4", path = "vendor/mysql", default-features = false, features = ["minimal-rust", "binlog", "rustls-tls-ring"] }
mysql_common = { version = "0.37", path = "vendor/mysql_common", default-features = false, features = ["binlog"] }
zstd = "0.14.3"
imbl = { version = "7.0.1", features = ["serde"] }
geo = { version = "0.31", default-features = false }

[target.'cfg(windows)'.dependencies]
jiff-tzdb = "0.1.9"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mydb"
path = "src/main.rs"

