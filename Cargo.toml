[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 0
incremental = true

[profile.test]
opt-level = 0
debug = 0
incremental = true
codegen-units = 16

[profile.release]
lto = false
codegen-units = 16
incremental = true


[profile.profiling]
inherits = "release"
debug = true
